a courbaril. Ocorre majoritariamente na Mata Atlântica dos estados de Rio de Janeiro e São Paulo. Seus folíolos e flores são geralmente menores. Os frutos são mais opacos e verrucosos e geralmente a superfície do epicarpo é ondulada, marcando a região onde se encontram as sementes dentro do fruto. Na chave de identificação: Inflorescências racemosas, corimbiformes, com eixos secundários e terciários curtos. Folíolos falcados, ápice acuminado a cuspidado; frutos não distendidos para o ápice, arredondados no ápice. Botões florais 6–6.5 × 6–6.5 mm; frutos marrons, opacos, verrucosos, lateralmente comprimidos, mas com câmaras de semente evidentes.","imageUrl":"images/img_0.jpg","links":[],"traits":{"jqp4i88t2":["v7irulxdg"],"f1r5drwxb":["llc2cuivv"],"se5u9ct9y":["k4624qsjy"],"uz0n0vqeg":["02vuqgvq0","al2at8bf3"],"k8118mk6d":["76zgz0en4"],"jhg7fpdhd":["9pj14tnvf"],"n7t6cg7va":["o6mi9nrcq"],"3t6h9gzg5":["wqygcy1rf"],"23qs5mkso":["mwru3rvlk"],"azyovm0iq":["kfdfggkx5"],"3f9okaak9":["e96vjn6e9"],"sotrf8es0":["xhyezjigd"],"4vgrgblfz":["cwi9sg2ri"],"hhh3uq5bm":["bqza4b2op"],"lsvvjdytx":["bfmnk0ee4"],"2tba6h2uu":["5n20my6wj"],"sq60upkxz":["k18abzmy1","83bjt24y2"],"sfim233yf":["vyzu0z47p","9fjw84ol3"],"uvqj18su7":["kg3yykfih"],"u6wvsyqwj":["2p4ytop4k"],"6ywv85igg":["f2t1471c1"],"2oj86kghc":["a6m9g87en"],"w80mlz3ae":["aag0w444d","9fhp7wgsj"],"ggm2gchfg":["jdptkqbd2"]}},{"id":"k9fak2se5","name":"Hymenaea aurea Y.T.Lee & Langenh.","scientificName":"Hymenaea aurea","family":"Fabaceae","description":"Tree up to 30 m; bark rough, usually peeling; branchlets 0.6-1 cm thick, glabrous to lanate when near the leaves. Petioles terete, basally and apically enlarged, 0.4-0.7 cm long, lanate; petiolules twisted, 3-5 mm long, lanate; leaflet blades coriaceous, oblong to obvate, sometimes elliptic, usually two times longer than wide, 5-11 × 3-5 cm, the base rounded asymmetric, the apex usually obtuse (rarely retuse), the abaxial surface densely golden lanate, the adaxial surface lustrous, sparsely lanulose, venation reticulate, the midrib and secundary veins salient abaxially and inconspicuous adaxially. Inflorescences racemose with short axes and a corimbiform aspect, terminal, the flowers spirally arranged on the axis, the axis rectangular in cross section, 1.7-3.7 mm wide, densely lanate; bracts early caducous. Pedicels rectangular in cross section, 5.8-7.5 × 1.6-2.1 mm, densely lanate; bracteoles paired, subopposite, located at the apex of the pedicel, obovate, 8.1-9 × 6.5-9.5 mm, densely golden sericeous externally and glabrous internally, caducous; hypanthium with a distension on the apex and an elongated base, the distension 4.4-4.6 mm wide, the elongation 7-8.7 mm long; flower buds golden, elliptic to ovate, 7.8-13.8 × 7-7.2 mm, densely sericeous. Calyx golden, densely sericeous externally and internally, the segments 4, subequal, elliptic to ovate, 13.5-14.5 × 8.3-11.8 mm. Corolla pentamerous, the petals subequals, white, membranaceous, glabrous or with very few sparsely hairs, caducous, the blade clawed, elliptic, the claw 3.5-5.2 mm long, the blade 11.8-14.8 × 4.8-6.7 mm. Stamens 10, glabrous, the filaments white to cream, 25-28 mm long, the anthers cream to yellow, oblong, 6.3-6.8 × 1.3-1.8 mm, glabrous. Gynoecium densely golden lanate; the stipe terete in cross section, 2-2.4 mm long, glabrous, the ovary oblong or slightly arcuate-elliptic, 8.7-9.6 × 4-4.5 mm, densely golden lanate, ovules ca. 12, the style terete in cross section, 22-27 mm long, glabrous, the stigma punctiform. Fruits light brown, opaque, relatively smooth, laterally compressed slightly evidencing seed chambers, sparsely lanate when immature and glabrescent when mature, the body oblong to slightly arcuate, 9-15 × 7-10 cm. Seeds 5-8 per fruit. Descrição com campos controlados: Caule: casca em escama(s). Folha: consistência do folíolo(s) cartáceo(s); forma do folíolo(s) largamente elíptico(s)/oblongo(s); superfície(s) do folíolo(s) lustroso(s)/pubescente(s) na(s) face(s) abaxial e adaxial; venação conspícuo(s) na(s) face(s) abaxial/depressa(s) na(s) face(s) adaxial. Inflorescência: tipo cimeira(s) dicasial ou corimbiforme(s). Flor: botão-floral dourado/cor castanha; posição das sépala(s) não reflexa(s); superfície(s) das sépala(s) face(s) adaxial pubescente(s); cor das pétala(s) branca; superfície(s) das pétala(s) glabra(s); ovário(s) glabro(s)/totalmente pubescente(s). Fruto: cor cor castanha escura; epicarpo levemente verrucoso(s)/opaco(s). Semente: cor castanha escura; número 3 a(s) 7. Na chave de identificação: Inflorescências racemosas, corimbiformes, com eixos secundários e terciários curtos. Árvores até 40m. Folíolos cobertos por pelos abaxialmente. Casca relativamente lisa. Folíolos oblongos ou elípticos, 5–11 × 2–5 cm. Botões florais até 15 × 8 cm. Folíolos coriáceos, margem ligeiramente revoluta; pétalas unguiculadas; frutos marrom-claro, lateralmente comprimidos com as câmaras de semente ligeiramente evidentes; da Floresta Atlântica.","imageUrl":"images/img_1.jpg","links":[],"traits":{"jqp4i88t2":["v7irulxdg"],"f1r5drwxb":["llc2cuivv","rqttu1hp1"],"se5u9ct9y":["tgrx0afto","62ezkzv81"],"uz0n0vqeg":["9v5cyxord","hmvkqx4s7","02vuqgvq0"],"s2ohzl9nu":["9aqphs88y","2ldaug9zj"],"k8118mk6d":["fk03ro1sr"],"hze4uajp9":["42e7s168o"],"jhg7fpdhd":["sgfpb0i1z"],"n7t6cg7va":["vflmaxn3g"],"3t6h9gzg5":["wqygcy1rf"],"23qs5mkso":["hpqr7snri"],"3f9okaak9":["e96vjn6e9"],"sotrf8es0":["enh9p2uws"],"4vgrgblfz":["cwi9sg2ri"],"hhh3uq5bm":["bqza4b2op"],"lsvvjdytx":["cd417egq1"],"2tba6h2uu":["h3ogo9ogd"],"yt0g39egw":["ypmllrs8z"],"sq60upkxz":["k18abzmy1","kxsap5eu7"],"sfim233yf":["qlxm66uc3"],"uvqj18su7":["nja75p6km"],"6ywv85igg":["f2t1471c1"],"2oj86kghc":["a6m9g87en","yku249q49"],"w80mlz3ae":["aag0w444d","9fhp7wgsj"],"ggm2gchfg":["jdptkqbd2"]}},{"id":"ymu7s9drc","name":"Hymenaea cangaceira R.B.Pinto, Mansano & A.M.G.Azevedo","scientificName":"Hymenaea cangaceira","family":"Fabaceae","description":"Trees to c. 10 m, rarely taller; bark striate, light to eae","description":"Tree up to ca. 40 m; bark smooth, or slightly striate, gray; exudate translucid yellowish; branchlets terete in cross section, 0.4-1.0cm thick, glabrescent. Petioles terete, basally and apically enlarged, 0.7-1.8 cm long, tomentose to glabrescent; petiolules twisted, 3.1-5.9 mm long, tomentose to glabrescent. Leaflet blades chartaceous to coriaceous, elliptic to oblong or ovate, two to three times longer than wide, 5.8-12 × 2.9-4.1 cm, the base obliquely rounded, asymmetric, the apex acuminate to cuspidate or rounded, the abaxial surface glabrous to densely tomentose, the adaxial surface glabrous to sparsely hispidulous, the midrib and secondary veins salient abaxially and inconspicuous adaxially. Inflorescences racemose with shortened secondary and tertiary axis, giving a corimbiform aspect, terminal, the flowers spirally arranged on the axis, the axis rectangular, 1.6-2.3 mm wide, tomentose to minutely tomentose; bracts early caducous. Pedicels rectangular to terete in cross section, 2.4-6 × 1.2-1.4 mm, sericeous; bracteoles, early caducous; hypanthium 3-4.1 × 3.3-3.8 mm; flower buds light brown to golden, elliptic to globular, 5.6-8.5 × 4.6-5.6 mm, tomentose. Calyx light brown to golden, densely tomentose abaxially and sericeous adaxially, the segments 4, subequal, elliptic to ovate, 6.9-8.5 × 3.4-6.8 mm. Corolla pentamerous, the petals subequals, white, membranaceous, usually totally glabrous or with few, sparsely hair adaxially, caducous, the blade slightly clawed, elliptic, claw ca. 1 mm long, blade 5.7-6.3 × 1.8-2.2 mm. Stamens 10 glabrous, the filaments white, with glands on the surface, 8.7-11 mm long, the anthers cream to yellow, oblong to elliptic, 2.2-2.8 × 1.2-1.5 mm, glabrous. Gynoecium cream-yellowish, reddish when fecundated, glabrous; the stipe terete in cross section, 2.1-2.5 mm long, glabrous, the ovary arcuate-deltoid, 3.3-4.5 × 2.1-3 mm, glabrous (rarely with few in one side, at the base), ovules ca. 7, the style terete in cross section, ca. 18 mm long, glabrous, the stigma punctiform. Fruits opaque light-brown, usually smooth with small resin pockets, glabrous, arcuate-deltoid, 4.5-6.5 × 3-4 cm. Seeds ca. 1-3 per fruit. Descrição com campos controlados: Caule: casca em escama(s). Folha: consistência do folíolo(s) cartáceo(s); forma do folíolo(s) largamente elíptico(s)/oblongo(s); superfície(s) do folíolo(s) lustroso(s)/pubescente(s) na(s) face(s) abaxial/glabro(s) ou glabrescente(s); venação conspícuo(s) na(s) face(s) abaxial/não depressa(s) na(s) face(s) adaxial. Inflorescência: tipo cimeira(s) dicasial ou corimbiforme(s). Flor: botão-floral cor castanha; posição das sépala(s) não reflexa(s); superfície(s) das sépala(s) face(s) adaxial pubescente(s); cor das pétala(s) branca; superfície(s) das pétala(s) glabra(s); ovário(s) glabro(s). Fruto: cor cor castanha escura; epicarpo liso(s)/opaco(s). Semente: cor castanha escura; número 3 a(s) 7. Na chave de identificação: Inflorescências racemosas, corimbiformes, com eixos secundários e terciários curtos. Plantas da floresta Amazônica. Folíolos concolores quando secos, venação com veias terciárias e quaternárias inconspícuas. Folíolos geralmente com ápice arredondado; ovário arcuate-deltoide/oblongo; frutos deltoides ou ovoides a elipsoides, marrom-claro opaco, até 7.5 × 4.5 cm, com 1–3 sementes. Folíolos abaxialmente glabros a densamente tomentosos; ovário e frutos arcuate-deltoides.","imageUrl":"images/img_6.jpg","links":[],"traits":{"jqp4i88t2":["v7irulxdg"],"f1r5drwxb":["llc2cuivv"],"se5u9ct9y":["62ezkzv81"],"uz0n0vqeg":["02vuqgvq0","9v5cyxord","2imjxpfb9"],"k8118mk6d":["fb3s0edq0"],"jhg7fpdhd":["9pj14tnvf","o024jcy68"],"rvqrpng4l":["ctxnehp0n"],"n7t6cg7va":["rtya45hnq","4yxmbvl99"],"3t6h9gzg5":["wqygcy1rf"],"23qs5mkso":["v7jcali3y"],"3f9okaak9":["e96vjn6e9"],"sotrf8es0":["enh9p2uws"],"4vgrgblfz":["cwi9sg2ri"],"hhh3uq5bm":["bqza4b2op"],"lsvvjdytx":["bfmnk0ee4"],"2tba6h2uu":["5n20my6wj"],"yt0g39egw":["f0bwlu2wj"],"s87iajz9n":["w438q4tg0",                   </button>
                </div>
              </div>
              <div class="flex-1 overflow-y-auto p-4 space-y-4 custom-scrollbar">${featuresHTML}</div>
            </div>
            
            <div class="flex-1 flex flex-col h-full ${mobileTab==='RESULTS'?'flex':'hidden md:flex'}">
              <div class="p-4 border-b bg-slate-50 flex justify-between items-center">
                <div>
                  <span class="font-semibold text-slate-700">${remaining.length === 1 ? strings.identified : remaining.length + ' ' + strings.potential}</span>
                </div>
                ${discarded.length > 0 ? `<button onclick="toggleDiscarded()" class="text-sm text-slate-500 hover:text-slate-700 flex items-center gap-1">${showDiscarded?'🔼':'🔽'} ${strings.discarded} (${discarded.length})</button>` : ''}
              </div>
              <div class="flex-1 overflow-y-auto p-4 custom-scrollbar">
                <div class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3">${remainingHTML}</div>
                ${discardedHTML}
              </div>
            </div>
          </div>
          
          <footer class="bg-white border-t px-4 py-2 text-center text-xs text-slate-400">
            ${strings.createdWith} • <a href="https://djhandoom.github.io/nozes/" target="_blank" class="text-emerald-600 hover:underline">djhandoom.github.io/nozes</a>
          </footer>
        </div>
        ${entityModalHTML}
        ${stateImageModalHTML}
      `;
    }
    
    render();
  </script>
</body>
</html>
